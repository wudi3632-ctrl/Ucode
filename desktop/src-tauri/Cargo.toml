[package]
name = "ucode-portable"
version = "0.2.0"
description = "Portable Super Agent compatible coding desktop"
authors = ["UCode"]
edition = "2021"

[lib]
name = "ucode_portable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Keep release builds self-contained even when somebody invokes Cargo directly.
# `tauri dev` disables default features, while every normal/release build embeds
# the frontend through Tauri's custom protocol instead of opening devUrl.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
notify-rust = "4.19"
windows-registry = "0.6"

[dev-dependencies]
tempfile = "3"
